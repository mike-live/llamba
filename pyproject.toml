[project]
name = "llamba"
dynamic = ["dependencies"]
[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
version = "0.1.12"
description = "A library to merge BioAge models with LLMs!"
readme = "README.md"
authors = [
  "Sergei Tikhomirov <sergey.zr.co.uk@gmail.com>", 
  "Mike Krivonosov <krivonosov@itmm.unn.ru>"
]
maintainers = [
    "Sergei Tikhomirov <sergey.zr.co.uk@gmail.com>", 
    "Mike Krivonosov <krivonosov@itmm.unn.ru>"
]
repository = "https://github.com/mike-live/llamba"

[tool.poetry.dependencies]
#python = "3.11.*"
python = ">=3.11,<3.13"
numpy = ">=1,<3.0.0"
pandas = ">=2.2.3,<4.0.0"
scipy = "^1.12.0"
omegaconf = "*"
scikit-learn = ">1.5.2,<=2.0.0"
openpyxl = "3.1.5"
requests = "^2.32.5"
qdrant-client = "^1.16.1"

torch = { version = "==2.11.0+cpu", source = "torch-cpu", python = ">=3.12,<3.13" }
bio-agents = { git = "ssh://git@github.com/pdf-dataflow/vec_box.git", extras = ["qdrant", "github"], optional = true, python = ">=3.12,<3.13" }
settings = { git = "ssh://git@github.com/pdf-dataflow/pdf_dataflow.git", subdirectory = "settings", python = ">=3.12,<3.13", optional = true }
llamba-library = { git = "ssh://git@github.com/pdf-dataflow/llamba_library.git", branch='stage2'}

[project.optional-dependencies]
vec-search = [
    "bio-agents[qdrant,github]",
    "settings",
]

[[tool.poetry.source]]
name = "torch-cpu"
url = "https://download.pytorch.org/whl/cpu"
priority = "explicit"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.3"
